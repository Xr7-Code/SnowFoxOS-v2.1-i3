# SnowFoxOS — Picom Configuration

#################################
#           Backend             #
#################################
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;
unredir-if-possible = true;

#################################
#           Shadows             #
#################################

shadow = true;
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.5;

# Schließt typische Fenster aus, aber behält Polybar und Rofi bei.
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.06;
fade-delta = 4;

#################################
#           Corners             #
#################################

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#           Wintypes            #
#################################

wintypes:
{
  tooltip      = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; };
  dock         = { shadow = true; full-shadow = true; };
  utility      = { shadow = true; full-shadow = true; };
  toolbar      = { shadow = true; };
  popup_menu   = { opacity = 1.0; shadow = true; };
  dropdown_menu = { opacity = 1.0; shadow = true; };
  dnd          = { shadow = false; };
};