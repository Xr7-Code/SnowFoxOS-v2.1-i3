; ============================================================
;  SnowFoxOS v2.1 — Polybar Config
; ============================================================

[colors]
bg        = #1a1a1a
bg-alt    = #242424
fg        = #e8e8e8
fg-dim    = #a0a0a0
border    = #3a3a3a
purple    = #7B5EA7
orange    = #E8750A
red       = #e05555
green     = #5faf5f

; ============================================================
;  Desktop Bar (kein Akku, keine Helligkeit)
; ============================================================
[bar/snowfox]
width = 100%
height = 32
radius = 0
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = Inter:size=10;2
font-1 = Noto Sans:size=10;2
font-2 = "Noto Color Emoji:scale=8;3"
font-3 = "JetBrainsMono Nerd Font Mono:size=11;2"

modules-left   = menu i3
modules-center = date
modules-right  = memory network pulseaudio

wm-restack = i3
override-redirect = false

tray-position   = right
tray-maxsize    = 18
tray-padding    = 4
tray-background = ${colors.bg}

; ============================================================
;  Laptop Bar (mit Akku + Helligkeit)
; ============================================================
[bar/snowfox-laptop]
inherit = bar/snowfox
modules-right  = backlight battery memory network pulseaudio

; ============================================================
;  Module
; ============================================================

; ── Fuchs Menü ───────────────────────────────────────────────
[module/menu]
type = custom/text
content = %{A1:rofi -show drun -theme ~/.config/rofi/config.rasi:}🦊%{A}
content-font = 3
content-foreground = ${colors.fg}
content-padding = 1

; ── i3 Workspaces ────────────────────────────────────────────
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.orange}
label-focused = %index%
label-focused-foreground = ${colors.fg}
label-focused-underline = ${colors.purple}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2
label-urgent = %index%
label-urgent-foreground = ${colors.orange}
label-urgent-padding = 2

; ── Uhr ──────────────────────────────────────────────────────
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %H:%M  %a %d.%m.%Y
label = %date%
label-foreground = ${colors.fg}

; ── RAM ──────────────────────────────────────────────────────
[module/memory]
type = internal/memory
interval = 5
format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${colors.purple}
label = %percentage_used%%
label-foreground = ${colors.fg-dim}

; ── Netzwerk WLAN ────────────────────────────────────────────
[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = "󰖩 "
format-connected-prefix-font = 3
format-connected-prefix-foreground = ${colors.purple}
format-connected = <label-connected>
label-connected = %essid%
label-connected-foreground = ${colors.fg-dim}
format-disconnected = <label-disconnected>
label-disconnected = "󰖪 off"
label-disconnected-font = 3
label-disconnected-foreground = ${colors.fg-dim}

; ── Lautstärke ───────────────────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg-dim}
label-muted = "󰸈 stumm"
label-muted-foreground = ${colors.fg-dim}
ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-font = 3
ramp-volume-foreground = ${colors.purple}

; ── Batterie ─────────────────────────────────────────────────
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
full-at = 99
low-at = 15
format-charging    = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = <label-full>
format-low         = <ramp-capacity> <label-low>
label-charging     = %percentage%%
label-discharging  = %percentage%%
label-full         = "󰁹 voll"
label-low          = %percentage%%
label-full-foreground        = ${colors.fg-dim}
label-charging-foreground    = ${colors.fg-dim}
label-discharging-foreground = ${colors.fg-dim}
label-low-foreground         = ${colors.orange}
ramp-capacity-0 = "󰁺"
ramp-capacity-1 = "󰁻"
ramp-capacity-2 = "󰁽"
ramp-capacity-3 = "󰁿"
ramp-capacity-4 = "󰂁"
ramp-capacity-font = 3
ramp-capacity-foreground = ${colors.purple}
animation-charging-0 = "󰂆"
animation-charging-1 = "󰂇"
animation-charging-2 = "󰂈"
animation-charging-font = 3
animation-charging-foreground = ${colors.purple}
animation-charging-framerate = 750

; ── Helligkeit ───────────────────────────────────────────────
[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
label-foreground = ${colors.fg-dim}
ramp-0 = "󰃚"
ramp-1 = "󰃞"
ramp-2 = "󰃠"
ramp-font = 3
ramp-foreground = ${colors.purple}
